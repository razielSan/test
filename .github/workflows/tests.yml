name: Tests

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main



jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry 

      - name: Config Poetry
        run: poetry  config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Create .env for tests
        env: |
          echo "DATABASE_CONNECT=${{ secrets.DATABASE_CONNECT }}" >> .env
          echo "REDIS_HOST=${{ secrets.RIDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "SECRET_KEY_TOKEN=${{ secrets.SECRET_KEY_TOKEN }}" >> .env
          echo "SECRET_KEY_TOKEN_REFRESH=${{ secrets.SECRET_KEY_TOKEN_REFRESH }}" >> .env
          echo "ALGORITHM_TOKEN=${{ secrets.ALGORITHM_TOKEN }}" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" >> .env
          echo "REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}" >> .env
        run: |
          printf '%s\n' \
            "DATABASE_CONNECT=$DATABASE_CONNECT" \
            "REDIS_HOST=$REDIS_HOST" \
            "REDIS_PORT=$REDIS_PORT" \
            "SECRET_KEY_TOKEN=$SECRET_KEY_TOKEN" \
            "SECRET_KEY_TOKEN_REFRESH=$SECRET_KEY_TOKEN_REFRESH" \
            "ALGORITHM_TOKEN=$ALGORITHM_TOKEN" \
            "ACCESS_TOKEN_EXPIRE_MINUTES=$ACCESS_TOKEN_EXPIRE_MINUTES" \
            "REFRESH_TOKEN_EXPIRE_DAYS=$REFRESH_TOKEN_EXPIRE_DAYS" > .env

      - name: Create .env.test for tests
        env: |
          echo "TEST_POSTGRESQL_URL=${{ secrets.TEST_POSTGRESQL_URL }}" >> .env.test
          echo "TEST_SQLITE_URL=${{ secrets.TEST_SQLITE_URL }}" >> .env.test
        run: |
          printf "%s\n" \
            "TEST_POSTGRESQL_URL=%TEST_POSTGRESQL_URL" \
            "TEST_SQLITE_URL=%TEST_SQLITE_URL" > .env.test

      - name: Install Redis Server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server

      - name: Check Redis status
        run: redis-cli ping


      - name: Pytest
        run: poetry run pytest tests
