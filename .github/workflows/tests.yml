name: Tests

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main



jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Create .env for tests
        run: |
          echo "DATABASE_CONNECT=sqlite+aiosqlite:///database/test.db" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "SECRET_KEY_TOKEN=12ade073afae91df03e4bbd9cc810fc3aeaacd3185a8a8d077c26c9d51b754a9" >> .env
          echo "SECRET_KEY_TOKEN=111645154f5d195169e3ed3638b844c555dcaa7d7d2b0ee64f829ca8c82232d0" >> .env
          echo "ALGORITHM_TOKEN=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=10" >> .env
          echo "REFRESH_TOKEN_EXPIRE_DAYSY=5" >> .env

      - name: Create .env.test for tests
        run: |
          echo "TEST_POSTGRESQL_URL=postgresql+psycopg://fastapi:123@localhost:5432/fastapi" >> .env.test
          echo "TEST_SQLITE_URL=sqlite+aiosqlite:///tests/test.db" >> .env.test

      - name: Install Redis Server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server

      - name: Check Redis status
        run: redis-cli ping

      - name: Install Poetry
        run: pip install poetry --no-interaction

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install Poetry Shell
        run: poetry shell --no-interaction

      - name: Pytest
        run: poetry run pytest tests --no-interaction
