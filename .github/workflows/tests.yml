name: Tests

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main



jobs:
  unit-tests:
    strategy:
      matrix:
        include:
          - python-version: "3.8.10"
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    # runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      # - name: Setup python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry 

      - name: Config Poetry
        run: poetry  config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --with dev --no-interaction


      - name: Create .env
        env:
          SECRET_KEY_TOKEN: ${{ secrets.SECRET_KEY_TOKEN }}
          SECRET_KEY_TOKEN_REFRESH: ${{ secrets.SECRET_KEY_TOKEN_REFRESH }}
          ALGORITHM_TOKEN: ${{ secrets.ALGORITHM_TOKEN }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
        run: |
          printf '%s\n' \
            "DATABASE_CONNECT=sqlite+aiosqlite:///test.db" \
            "REDIS_HOST=localhost" \
            "REDIS_PORT=6379" \
            "SECRET_KEY_TOKEN=$SECRET_KEY_TOKEN" \
            "SECRET_KEY_TOKEN_REFRESH=$SECRET_KEY_TOKEN_REFRESH" \
            "ALGORITHM_TOKEN=$ALGORITHM_TOKEN" \
            "ACCESS_TOKEN_EXPIRE_MINUTES=$ACCESS_TOKEN_EXPIRE_MINUTES" \
            "REFRESH_TOKEN_EXPIRE_DAYS=$REFRESH_TOKEN_EXPIRE_DAYS" > .env

      - name: Create .env.test for tests
        run: |
          echo "TEST_POSTGRESQL_URL=${{ secrets.TEST_POSTGRESQL_URL }}"  >> .env.test
          echo "TEST_SQLITE_URL=${{ secrets.TEST_SQLITE_URL }}" >> .env.test

      - name: Install Redis Server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server

      - name: Check Redis status
        run: redis-cli ping


      - name: Pytest
        run: poetry run pytest tests
