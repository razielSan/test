repos:
  - repo: local
    hooks:
      - id: no-env-files
        name: Prevent committing environment files
        entry: python scripts/check_no_env_commit.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.1
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check, --diff]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy --config-file=mypy.ini .
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.0
    hooks:
      - id: codespell

  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.8' 
    hooks:
      - id: bandit
        args: ["-r", "src"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json    
