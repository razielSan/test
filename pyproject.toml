[tool.poetry]
name = "auth-register"
version = "0.1.0"
description = ""
authors = ["raziel <tvindzon@gmail.com>"]
readme = "README.md"
packages = [
    { include = "app", from = "src" },
    { include = "core", from = "src" },
    { include = "settings", from = "src" },
    { include = "infrastructure", from = "src" },
    { include = "dto", from = "src" },
    { include = "test_data", from = "src" },
    { include = "domain", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.8.10"
fastapi = {version = "0.111.0", extras = ["all"]}
httpx = "0.28.1"
pydantic-settings = "2.2.1"
pydantic = "2.6.1"
aiosqlite = "0.20.0"
argon2-cffi = "^25.1.0"
sqlalchemy = "^2.0.51"
alembic = "1.14.1"
asyncpg = "0.30.0"
psycopg = "3.2.13"
PyJWT = "2.9.0"
redis = "5.1.0"



[tool.poetry.group.dev.dependencies]
ruff = "0.4.1"
pre-commit = "3.5.0"
flake8 = "7.1.2"
mypy = "1.14.1"
black = "24.8.0"
pycodestyle = "2.12.1"
pydocstyle = "6.3.0"
pytest = "8.3.5"
pytest-cov = "5.0.0"
pytest-asyncio = "0.24.0"
pytest-mock =  "3.14.0"
bandit = "1.7.8"
detect-secrets = "1.5.0"
pip-audit = "2.7.3"
vulture = "2.11"
codespell = "2.4.0"
pytest-randomly = "3.15.0"
coverage = "7.6.1"



[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "B", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.codespell]
skip = ["./src/app/scripts/run_server_redis.bat", "./logs/app.logs"]

[tool.coverage.run]
omit = [
    "*/__init__.py",
]

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.poetry.scripts]
app = "app.main:run"
redis = "app.run_redis:run"
create-admin = "app.my_project.backend.cli.create_admin:cli"
create-roles = "app.my_project.backend.cli.filling_the_tables_sqlachemy:cli"
sqlite-prepare = "app.my_project.backend.cli.sqlite_prepare:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
